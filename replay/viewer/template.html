<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basketball 2D Replay</title>
<style>
:root {
  --bg: #f4f4f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #d9d9dc;
  --floor: #e9d3ae; --floor-line: #ffffff; --paint: #d9b98a; --accent: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --panel: #1e1e21; --text: #ececf0; --muted: #9a9aa2; --border: #34343a;
          --floor: #5a4630; --floor-line: #f1f1f1; --paint: #6b5338; --accent: #60a5fa; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; }
header .sub { color: var(--muted); }
main { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 16px; }
.pane { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; flex: 1 1 460px; min-width: 0; align-self: flex-start; }
canvas { width: 100%; display: block; }
video { width: 100%; display: block; background: #000; border-radius: 4px; }
#videoPane { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; }
.controls button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; min-width: 80px; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
select, input[type=number] { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
#scrubWrap { flex: 1 1 300px; position: relative; display: flex; align-items: center; min-width: 0; }
#scrub { flex: 1 1 auto; width: 100%; accent-color: var(--accent); margin: 0; }
#ticks { position: absolute; left: 8px; right: 8px; top: -7px; height: 8px; pointer-events: none; }
#ticks i { position: absolute; top: 0; width: 3px; height: 8px; margin-left: -1px; border-radius: 1px; }
#score { font-weight: 600; font-variant-numeric: tabular-nums; }
#score small { font-weight: normal; color: var(--muted); }
#events { padding: 0 16px 12px; display: none; }
#events h2 { font-size: 14px; margin: 0 0 6px; }
#events h2 small { font-weight: normal; color: var(--muted); }
#events ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
#events li button { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
#events li button.future { opacity: 0.55; }
#time { font-variant-numeric: tabular-nums; min-width: 170px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 16px 12px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--border); }
.badge { padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--border); }
.badge.ok { color: #15803d; } .badge.prop { color: #b45309; } .badge.none { color: #b91c1c; }
footer { color: var(--muted); padding: 0 16px 16px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Replay</h1><span class="sub" id="subtitle"></span>
  <span id="calibBadge" class="badge"></span>
  <span id="score"></span>
</header>
<main>
  <div class="pane"><canvas id="court"></canvas></div>
  <div class="pane" id="videoPane"><video id="video" muted playsinline preload="auto"></video></div>
</main>
<div class="controls">
  <button id="play">Play</button>
  <span id="scrubWrap"><span id="ticks"></span>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time"></span>
  <span id="time"></span>
  <label>Speed <select id="speed">
    <option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option>
  </select></label>
  <label><input type="checkbox" id="trails"> Trails</label>
  <label>length <input type="number" id="trailLen" value="2" min="0.5" max="10" step="0.5" style="width:56px"> s</label>
  <label><input type="checkbox" id="labels" checked> IDs</label>
  <label><input type="checkbox" id="showInterp" checked> Interpolated</label>
  <label><input type="checkbox" id="showUnknown"> Unclassified</label>
  <label><input type="checkbox" id="showVideo"> Video</label>
  <label>Load video <input type="file" id="videoFile" accept="video/*"></label>
</div>
<div class="legend" id="legend"></div>
<div id="events"><h2>Detected baskets <small id="eventsNote"></small></h2><ul id="eventList"></ul></div>
<footer>Hollow dots are interpolated positions (short gaps of 1 s or less). Positions are the floor point under the
  player's feet. Frames with no court calibration show no positions. Keys: space play/pause, arrow keys ±1 s.</footer>
<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const canvas = $("court"), ctx = canvas.getContext("2d");
const video = $("video");
const L = D.court.length, W = D.court.width, PAD = 1.2;
const colors = { A: D.game.teams.A.primary, B: D.game.teams.B.primary, referee: "#facc15", unknown: "#e5e7eb" };
let T = D.t.length ? D.t[0] : 0, playing = false, lastTs = null, speed = 1, videoReady = false;

$("title").textContent = `${D.game.teams.A.name} vs ${D.game.teams.B.name}`;
$("subtitle").textContent = [D.game.game_date, D.game.location].filter(Boolean).join(" · ");
$("legend").innerHTML = [["A", D.game.teams.A.name], ["B", D.game.teams.B.name], ["referee", "Referee"], ["unknown", "Unknown"]]
  .map(([k, n]) => `<span><span class="sw" style="background:${colors[k]}"></span>${n}</span>`).join("");
const t0 = D.t[0] || 0, t1 = D.t[D.t.length - 1] || 0;
$("scrub").min = t0; $("scrub").max = t1;

// ---- detected events (baskets), optional: ticks on the time slider, a clickable list, the running score
const EV = (Array.isArray(D.events) ? D.events : []).filter(e => e && isFinite(e.t)).sort((a, b) => a.t - b.t);
const PPB = D.points_per_basket || 2;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const isTeam = k => k === "A" || k === "B";
function evPoints(e) { return e.points != null ? e.points : (e.type === "basket" && isTeam(e.team) ? PPB : 0); }
function teamName(k) { return (D.game.teams[k] || {}).name || k; }
function scoreAt(t) {
  const s = { A: 0, B: 0 };
  for (const e of EV) { if (e.t > t + 1e-6) break; if (isTeam(e.team)) s[e.team] += evPoints(e); }
  return s;
}
function fmtClock(s) { return `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`; }
if (EV.length) {
  const span = Math.max(1e-6, t1 - t0);
  $("ticks").innerHTML = EV.map(e => {
    const p = Math.min(1, Math.max(0, (e.t - t0) / span)) * 100;
    return `<i style="left:${p}%;background:${esc(colors[e.team] || "#f97316")}" title="${fmtClock(e.t)}"></i>`;
  }).join("");
  $("events").style.display = "block";
  $("eventsNote").textContent = "(" + (D.score_note || "detected automatically, not the official score") +
    "; " + PPB + " points per basket) - click to jump";
  $("eventList").innerHTML = EV.map((e, k) => {
    const s = scoreAt(e.t);
    const label = e.title || ("Basket - " + (isTeam(e.team) ? teamName(e.team) : "team unknown"));
    return `<li><button data-k="${k}"><span class="sw" style="background:${esc(colors[e.team] || "#f97316")}"></span>` +
      `${fmtClock(e.t)} ${esc(label)} &middot; ${s.A}-${s.B}</button></li>`;
  }).join("");
  $("eventList").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    setTime(EV[+b.dataset.k].t - 3);  // a few seconds before, to see the play
  });
}
function drawScore() {
  if (!EV.length) return;
  const s = scoreAt(T);
  $("score").innerHTML = `${esc(teamName("A"))} ${s.A} - ${s.B} ${esc(teamName("B"))} <small>(detected)</small>`;
  $("eventList").querySelectorAll("button").forEach(b => b.classList.toggle("future", EV[+b.dataset.k].t > T));
}

function resize() {
  const w = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  const h = w * (W + 2 * PAD) / (L + 2 * PAD);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function sx(x) { return (x + PAD) * canvas.clientWidth / (L + 2 * PAD); }
function sy(y) { return (W - y + PAD) * canvas.clientWidth / (L + 2 * PAD); }  // y = 0 (near sideline) at the bottom
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawCourt() {
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  ctx.fillStyle = css("--panel"); ctx.fillRect(0, 0, cw, ch);
  ctx.fillStyle = css("--floor"); ctx.fillRect(sx(0), sy(W), sx(L) - sx(0), sy(0) - sy(W));
  ctx.strokeStyle = css("--floor-line"); ctx.lineWidth = 1.5;
  for (const line of D.court.lines) {
    ctx.beginPath();
    line.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y)));
    ctx.stroke();
  }
  ctx.fillStyle = "#f97316";
  for (const [x, y] of D.court.baskets) { ctx.beginPath(); ctx.arc(sx(x), sy(y), 4, 0, 7); ctx.fill(); }
}

function frameIndex(t) {  // last index with D.t[i] <= t
  let lo = 0, hi = D.t.length - 1;
  if (t <= D.t[0]) return 0;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (D.t[mid] <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
function posAt(tr, i) {
  const j = i - tr.i0;
  if (j < 0 || j >= tr.x.length || tr.x[j] === null) return null;
  return [tr.x[j] / 100, tr.y[j] / 100, tr.f[j]];
}
function interpPos(tr, i, a) {
  const p = posAt(tr, i); if (!p) return null;
  const q = posAt(tr, i + 1); if (!q || a <= 0) return p;
  return [p[0] + (q[0] - p[0]) * a, p[1] + (q[1] - p[1]) * a, p[2]];
}

function draw() {
  if (!D.t.length) return;
  drawCourt();
  const i = frameIndex(T);
  const a = i + 1 < D.t.length ? Math.min(1, Math.max(0, (T - D.t[i]) / (D.t[i + 1] - D.t[i]))) : 0;
  const showInterp = $("showInterp").checked, trails = $("trails").checked, labels = $("labels").checked;
  const trailN = Math.round(parseFloat($("trailLen").value || 2) * D.fps);
  const r = Math.max(5, canvas.clientWidth / 110);
  for (const tr of D.tracks) {
    if (tr.team === "unknown" && !$("showUnknown").checked) continue;
    const col = colors[tr.team] || colors.unknown;
    if (trails) {
      ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.lineWidth = 2; ctx.beginPath();
      let pen = false;
      for (let k = Math.max(tr.i0, i - trailN); k <= i; k++) {
        const p = posAt(tr, k);
        if (!p) { pen = false; continue; }
        pen ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1])); pen = true;
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    const p = interpPos(tr, i, a);
    if (!p || (p[2] === 2 && !showInterp)) continue;
    ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), r, 0, 7);
    if (p[2] === 2) { ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke(); }
    else { ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = "#111"; ctx.stroke(); }
    if (labels) {
      ctx.font = `${Math.round(r * 1.25)}px system-ui, sans-serif`; ctx.fillStyle = css("--text");
      ctx.fillText(String(tr.id), sx(p[0]) + r + 2, sy(p[1]) - r);
    }
  }
  if (D.ball) {  // ball: filled = held by a player, dashed = estimated (in flight)
    const bt = { i0: 0, x: D.ball.x, y: D.ball.y, f: D.ball.f };
    const p = interpPos(bt, i, a);
    if (p && p[2]) {
      ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), r * 0.7, 0, 7);
      if (p[2] === 2) { ctx.setLineDash([3, 3]); ctx.strokeStyle = "#ea580c"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); }
      else { ctx.fillStyle = "#f97316"; ctx.fill(); ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
  }
  const c = D.calib[i], badge = $("calibBadge");
  badge.className = "badge " + (c === 2 ? "ok" : c === 1 ? "prop" : "none");
  badge.textContent = c === 2 ? "calibration: keyframe" : c === 1 ? "calibration: propagated" : "calibration: missing";
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  $("time").textContent = `${fmt(T)} / ${fmt(t1)}  · frame ${D.frame[i]}`;
  $("scrub").value = T;
  drawScore();
}

function videoSynced() { return $("showVideo").checked && videoReady; }
function setTime(t, fromVideo) {
  T = Math.min(t1, Math.max(t0, t));
  if (!fromVideo && videoSynced() && Math.abs(video.currentTime - T) > 0.05) video.currentTime = T;
  draw();
}
function setPlaying(p) {
  playing = p; $("play").textContent = p ? "Pause" : "Play";
  if (videoSynced()) { p ? video.play().catch(() => {}) : video.pause(); }
  lastTs = null;
}
function tick(ts) {
  if (playing) {
    if (videoSynced()) setTime(video.currentTime, true);
    else if (lastTs !== null) { setTime(T + (ts - lastTs) / 1000 * speed); }
    if (T >= t1) setPlaying(false);
    lastTs = ts;
  }
  requestAnimationFrame(tick);
}

$("play").onclick = () => { if (T >= t1) setTime(t0); setPlaying(!playing); };
$("scrub").oninput = e => setTime(parseFloat(e.target.value));
$("speed").onchange = e => { speed = parseFloat(e.target.value); video.playbackRate = speed; };
for (const id of ["trails", "labels", "showInterp", "trailLen", "showUnknown"]) $(id).onchange = draw;
$("showVideo").onchange = e => {
  $("videoPane").style.display = e.target.checked ? "block" : "none";
  if (e.target.checked && !video.src) { video.src = D.video_src; }
  if (e.target.checked && videoReady) { video.currentTime = T; if (playing) video.play().catch(() => {}); }
  else video.pause();
};
$("videoFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  video.src = URL.createObjectURL(f); $("showVideo").checked = true; $("videoPane").style.display = "block";
};
video.addEventListener("loadedmetadata", () => { videoReady = true; video.playbackRate = speed; video.currentTime = T; });
video.addEventListener("error", () => { videoReady = false; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.code === "ArrowRight") { e.preventDefault(); setTime(T + 1); }
  if (e.code === "ArrowLeft") { e.preventDefault(); setTime(T - 1); }
});
window.addEventListener("resize", resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
if (new URLSearchParams(location.search).get("video") === "1") {
  $("showVideo").checked = true; $("showVideo").onchange({ target: $("showVideo") });
}
resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
